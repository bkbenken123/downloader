<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Downloader</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>YouTube Downloader</h1>

        <label for="url">URL:</label>
        <input id="url" type="text" placeholder="Paste YouTube URL">

        <label for="downloadPath">Download Path (optional):</label>
        <input id="downloadPath" type="text" placeholder="Leave empty for default">

        <label for="mode">Mode:</label>
        <select id="mode">
            <option value="video">Video</option>
            <option value="audio">Audio</option>
        </select>

        <label for="container">Format:</label>
        <select id="container"></select>

        <label for="videoCodec">Video Codec:</label>
        <select id="videoCodec"></select>

        <label for="audioCodec">Audio Codec:</label>
        <select id="audioCodec"></select>

        <button id="download">Download</button>

        <label for="console">Console Output:</label>
        <pre id="console"></pre>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
