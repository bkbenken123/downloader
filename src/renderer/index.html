<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>YouTube Downloader</h1>

        <input id="url"
               placeholder="Paste URL" />

        <input id="downloadPath"
               placeholder="Download path (leave empty for default)" />

        <select id="mode">
            <option value="video">Video</option>
            <option value="audio">Audio</option>
        </select>

        <select id="container"></select>

        <select id="videoCodec"></select>

        <select id="audioCodec"></select>

        <button id="download">
            Download
        </button>

        <pre id="console"></pre>

    </div>

    <script src="renderer.js"></script>

</body>
</html>
